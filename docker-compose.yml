services:
  postgres:
    image: postgres:15-alpine
    container_name: film_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: film_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/purtovasofia/film-react-nest/backend:latest
    container_name: film_backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      NODE_ENV: production
    depends_on:
      - postgres
    networks:
      - app-network

  frontend:
    image: ghcr.io/purtovasofia/film-react-nest/frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: film_frontend
    ports:
      - "3000:80"
    volumes:
      - frontend-dist:/usr/share/nginx/html

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ghcr.io/purtovasofia/film-react-nest/nginx:latest
    container_name: film_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

volumes:
  postgres_data:
  frontend-dist:

networks:
  app-network:
    driver: bridge